[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "optics-portfolio-m2-private"
version = "0.1.0"
description = "Private algebraic complex-field prototype; not a Maxwell solver"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
