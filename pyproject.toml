[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hollow-core-fiber-numerical-study"
version = "0.2.0"
description = "Parameter validation, complex-field arithmetic and task provenance"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
plots = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
